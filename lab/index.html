<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Mástil Lab: mástil interactivo, metrónomo, entrenadores de teoría, ritmo y oído, backing tracks, creador de tabs y registro de práctica para guitarristas."
    />
    <title>Mástil Lab · Estudio de guitarra</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Crect width='44' height='44' rx='10' fill='%2317251f'/%3E%3Cpath d='M11 10v24M20 10v24M29 10v24' stroke='%23f6f1e6' stroke-width='1.4' opacity='.65'/%3E%3Cpath d='M7 16h30M7 22h30M7 28h30' stroke='%23f6f1e6' stroke-width='1.4' opacity='.65'/%3E%3Ccircle cx='24' cy='25' r='5' fill='%230f0f0e' stroke='%23df812f' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#17251f" />
    <link rel="stylesheet" href="./lab.css" />
    <script>
      // Tema antes de pintar (sin destello claro en modo oscuro).
      (function () {
        try {
          var p = localStorage.getItem('lab:page-theme') || 'auto';
          var d = localStorage.getItem('lab:diagram-theme') || 'auto';
          var dark = p === 'dark' || (p === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.diagram = d === 'auto' ? (dark ? 'night' : 'classic') : d;
        } catch (e) { /* sin almacenamiento */ }
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <header class="lab-top">
      <a class="brand" href="#/" aria-label="Mástil Lab, inicio">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 44 44" role="presentation">
            <rect x="5" y="4" width="34" height="36" rx="7" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path d="M12 11v22M19 11v22M26 11v22M33 11v22" stroke="currentColor" stroke-width="1.1" opacity=".55" />
            <path d="M8 16h28M8 22h28M8 28h28" stroke="currentColor" stroke-width="1.1" opacity=".55" />
            <circle cx="21.5" cy="25" r="5.1" fill="currentColor" />
            <circle cx="21.5" cy="25" r="7.1" fill="none" stroke="var(--orange)" stroke-width="1.8" />
          </svg>
        </span>
        <span class="brand-copy">
          <span class="brand-name">Mástil <em>Lab</em></span>
          <span class="brand-tagline">Estudio de guitarra · todo en tu navegador</span>
        </span>
      </a>
      <div class="top-actions">
        <span id="streak-chip" class="chip" title="Racha de práctica" hidden></span>
        <button id="share-btn" class="btn btn-outline btn-sm" type="button" title="Copiar enlace a esta herramienta con su configuración">Copiar enlace</button>
        <a class="btn btn-dark btn-sm" href="../index.html">Plantillas CAGED</a>
      </div>
    </header>

    <div class="lab-shell">
      <nav id="nav" class="lab-nav" aria-label="Herramientas"></nav>
      <main id="main" class="lab-main" tabindex="-1"></main>
    </div>

    <footer class="site-copyright"><small>© 2026 Mástil Studio · Uso no comercial (<a href="https://polyformproject.org/licenses/noncommercial/1.0.0/">licencia PolyForm Noncommercial 1.0.0</a>)</small></footer>

    <noscript><p class="noscript">Mástil Lab necesita JavaScript.</p></noscript>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
